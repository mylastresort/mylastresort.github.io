name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires node >= 22.22.0 (Vite/Rolldown alone would accept 20.19).
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile resume PDF from LaTeX
        # Writes public/resume.pdf. This must precede the build: Astro copies
        # public/ into dist at build time, so a later compile would not ship.
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/xu-cheng/texlive-full:latest \
            sh -eu -c "kpsewhich carlito.sty && latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=public -auxdir=/tmp/resume-aux resume/resume.tex && cat /tmp/resume-aux/resume.log public/resume.log 2>/dev/null | grep -q 'T1Crlt-LF' && ! cat /tmp/resume-aux/resume.log public/resume.log 2>/dev/null | grep -qi 'falling back' && cat /tmp/resume-aux/resume.log public/resume.log 2>/dev/null | grep -q 'Crlt-.*\.pfb' && test -s public/resume.pdf && echo 'resume: Carlito lining figures verified'"
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4